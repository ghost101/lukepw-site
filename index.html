  <img src="" alt="" />

<script>
  const toggle = document.querySelector('.menu-toggle');
  const nav = document.querySelector('.main-nav');
  toggle.addEventListener('click', () => {
    const expanded = toggle.getAttribute('aria-expanded') === 'true';
    toggle.setAttribute('aria-expanded', String(!expanded));
    nav.classList.toggle('is-open');
  });

  const slides = Array.from(document.querySelectorAll('.carousel-slide'));
  const filterLinks = Array.from(document.querySelectorAll('[data-filter]'));
  const prevBtn = document.querySelector('.carousel-control.prev');
  const nextBtn = document.querySelector('.carousel-control.next');
  const carousel = document.querySelector('.carousel');
  const gallery = document.querySelector('.project-gallery');
  const galleryTitle = document.querySelector('.project-gallery-title');
  const thumbnailGrid = document.querySelector('.thumbnail-grid');
  const lightbox = document.querySelector('.lightbox');
  const lightboxImage = document.querySelector('.lightbox img');
  const lightboxClose = document.querySelector('.lightbox-close');
  const filterLabels = {
    all: 'All work',
    bookcase: 'Bookcases',
    cabinet: 'Cabinets',
    gate: 'Gate',
    coop: 'Chicken coop',
    table: 'Tables'
  };
  let visibleSlides = slides;
  let current = 0;
  let shuffledIndexes = [];
  let shuffledPosition = 0;
  let timer = null;
  let activeThumbnail = null;

  function shuffleSlides() {
    shuffledIndexes = slides.map((slide, i) => i);
    for (let i = shuffledIndexes.length - 1; i > 0; i -= 1) {
      const j = Math.floor(Math.random() * (i + 1));
      [shuffledIndexes[i], shuffledIndexes[j]] = [shuffledIndexes[j], shuffledIndexes[i]];
    }
    shuffledPosition = 0;
  }

  function showSlide(index) {
    if (!visibleSlides.length) { return; }
    visibleSlides[current].classList.remove('is-active');
    current = (index + visibleSlides.length) % visibleSlides.length;
    visibleSlides[current].classList.add('is-active');
  }

  function showShuffledSlide(step = 1) {
    if (!shuffledIndexes.length) { shuffleSlides(); }
    shuffledPosition += step;
    if (shuffledPosition >= shuffledIndexes.length || shuffledPosition < 0) {
      const previous = shuffledIndexes[shuffledPosition < 0 ? 0 : shuffledIndexes.length - 1];
      shuffleSlides();
      if (shuffledIndexes[0] === previous && shuffledIndexes.length > 1) {
        [shuffledIndexes[0], shuffledIndexes[1]] = [shuffledIndexes[1], shuffledIndexes[0]];
      }
      shuffledPosition = step < 0 ? shuffledIndexes.length - 1 : 0;
    }
    showSlide(shuffledIndexes[shuffledPosition]);
  }

  function nextSlide() { showShuffledSlide(1); }
  function prevSlide() { showShuffledSlide(-1); }

  function startAuto() {
    stopAuto();
    timer = setInterval(nextSlide, 4000);
  }
  function stopAuto() {
    if (timer) { clearInterval(timer); timer = null; }
  }

  nextBtn.addEventListener('click', () => { nextSlide(); startAuto(); });
  prevBtn.addEventListener('click', () => { prevSlide(); startAuto(); });

  function setActiveFilter(filter) {
    filterLinks.forEach((item) => item.classList.toggle('is-active', item.dataset.filter === filter));
  }

  function showCarousel() {
    gallery.hidden = true;
    carousel.hidden = false;
    visibleSlides = slides;
    slides.forEach((slide) => slide.classList.remove('is-active', 'is-hidden'));
    shuffleSlides();
    showSlide(shuffledIndexes[0]);
    startAuto();
  }

  function showGallery(filter, selectedSrc = '') {
    stopAuto();
    carousel.hidden = true;
    gallery.hidden = false;
    galleryTitle.textContent = filterLabels[filter];
    thumbnailGrid.innerHTML = '';
    activeThumbnail = null;

    slides.filter((slide) => slide.dataset.project === filter).forEach((slide) => {
      const img = slide.querySelector('img');
      const button = document.createElement('button');
      const thumb = document.createElement('img');

      button.type = 'button';
      button.className = 'thumbnail-card';
      thumb.src = img.src;
      thumb.alt = img.alt;
      button.setAttribute('aria-label', `Open ${img.alt}`);
      button.appendChild(thumb);
      if (img.src === selectedSrc) {
        button.classList.add('is-selected');
        activeThumbnail = button;
      }
      button.addEventListener('click', () => openLightbox(img.src, img.alt));
      thumbnailGrid.appendChild(button);
    });
  }

  function openLightbox(src, alt) {
    lightboxImage.src = src;
    lightboxImage.alt = alt;
    lightbox.hidden = false;
    lightboxClose.focus();
  }

  function openCarouselImage(slide) {
    const filter = slide.dataset.project;
    const img = slide.querySelector('img');

    setActiveFilter(filter);
    showGallery(filter, img.src);
    openLightbox(img.src, img.alt);
  }

  function closeLightbox() {
    lightbox.hidden = true;
    lightboxImage.src = '';
    lightboxImage.alt = '';
    if (activeThumbnail) {
      activeThumbnail.scrollIntoView({ block: 'center' });
    }
  }

  filterLinks.forEach((link) => {
    link.addEventListener('click', (event) => {
      event.preventDefault();
      const filter = link.dataset.filter;

      setActiveFilter(filter);
      if (filter === 'all') {
        showCarousel();
      } else {
        showGallery(filter);
      }
    });
  });

  slides.forEach((slide) => {
    const img = slide.querySelector('img');
    img.tabIndex = 0;
    img.addEventListener('click', () => openCarouselImage(slide));
    img.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        openCarouselImage(slide);
      }
    });
  });

  carousel.addEventListener('mouseenter', stopAuto);
  carousel.addEventListener('mouseleave', startAuto);
  lightboxClose.addEventListener('click', closeLightbox);
  lightbox.addEventListener('click', (event) => {
    if (event.target === lightbox) { closeLightbox(); }
  });
  document.addEventListener('keydown', (event) => {
    if (event.key === 'Escape' && !lightbox.hidden) { closeLightbox(); }
  });

  shuffleSlides();
  showSlide(shuffledIndexes[0]);
  startAuto();
</script>
</body>
