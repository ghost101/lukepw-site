<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>LUKE P. W.</title>
  <link rel="apple-touch-icon" sizes="180x180" href="/favicon_io/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon_io/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon_io/favicon-16x16.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
<header class="site-header">
    <a href="index.html" class="site-title"><img src="images/luke_logo.png" alt="" class="site-logo">LUKE P. W.</a>
  <button class="menu-toggle" aria-expanded="false" aria-controls="main-nav">Menu</button>
  <nav id="main-nav" class="main-nav">
    <ul class="nav-list">
      <li class="nav-item"><a href="index.html">Work</a></li>
      <li class="nav-item"><a href="about.html">About</a></li>
      <li class="nav-item"><a href="contact.html">Contact</a></li>
      <li class="nav-item"><a href="legal.html">©</a></li>
    </ul>
  </nav>
</header>
<main class="page-main">
  <form class="contact-form" data-formsubmit-endpoint="https://formsubmit.co/ajax/lukepw@live.co.uk">
    <h2>Contact Me</h2>

    <label for="contact-name">Name</label>
    <input id="contact-name" type="text" name="name" required>

    <label for="contact-email">Email</label>
    <input id="contact-email" type="email" name="email" required>

    <label for="contact-message">Message</label>
    <textarea id="contact-message" name="message" required></textarea>

    <input type="hidden" name="_subject" value="New Contact Form Message">
    <input type="text" name="_honey" tabindex="-1" autocomplete="off" hidden>

    <button type="submit">Send Message</button>
    <p class="form-status" role="status" aria-live="polite"></p>
  </form>

</main>
<footer class="site-footer">
  <span>© 2026 – Luke Williams</span>
</footer>
<script>
  const t = document.querySelector('.menu-toggle');
  const n = document.querySelector('.main-nav');
  t.addEventListener('click', () => {
    const expanded = t.getAttribute('aria-expanded') === 'true';
    t.setAttribute('aria-expanded', String(!expanded));
    n.classList.toggle('is-open');
  });

  const contactForm = document.querySelector('.contact-form');
  const formStatus = document.querySelector('.form-status');

  contactForm.addEventListener('submit', async (event) => {
    event.preventDefault();

    formStatus.textContent = 'Sending...';

    const submitButton = contactForm.querySelector('button[type="submit"]');
    submitButton.disabled = true;

    try {
      const response = await fetch(contactForm.dataset.formsubmitEndpoint, {
        method: 'POST',
        headers: {
          Accept: 'application/json'
        },
        body: new FormData(contactForm)
      });

      if (!response.ok) {
        throw new Error('Form submission failed.');
      }

      window.location.href = 'thankyou.html';
    } catch (error) {
      formStatus.textContent = 'Sorry, there was a problem sending your message. Please email lukepw@live.co.uk instead.';
      submitButton.disabled = false;
    }
  });
</script>
</body>
</html>
